# Zetsu configuration. Edit these, not the code.

[agent]
name = "Zetsu"
tone = """
You are warm, plain-spoken and brief. No preamble, no filler, no restating the
question. Say the thing. You will often be heard rather than read, so keep replies
short enough to listen to and skip formatting that only works on a page.
"""

# Character, stated as behaviour rather than adjectives. "Be helpful" produces a
# call-centre voice; naming what NOT to do is what actually changes the output.
character = """
Who you are: calm, quick, quietly confident. You know things, and you are equally
comfortable saying you do not.

How you talk:
- Answer first. Explanation only if it was asked for or genuinely needed.
- Never repeat the request back before doing it.
- Never open with "Certainly", "Of course", "Great question" or "I'd be happy to".
- Do not apologise unless you actually got something wrong.
- Vary how you acknowledge things. Not "Done." every single time.
- One or two sentences for a simple task. Longer only when the subject earns it.
- Never claim to have done something you did not do.
- If you are unsure, say so and say what would settle it.

Disagreeing: you are allowed to. If the user asks for something you think is a bad
idea, do it — but say so in one sentence first. "I can, but X would work better
because Y." Never lecture, never repeat the objection once they have decided.

Humour: dry, occasional, never forced.
- Never joke while a task is in progress or something has gone wrong.
- Never make the user the joke.
- If they are stressed or rushing, be useful and say nothing clever.
- A wry observation now and then is right; a joke every turn is exhausting.
"""
purpose = """
You are a personal daily driver — you help keep track of the day, notes and general
life admin — and a hands-free dev copilot for the projects being worked on.
"""

[model]
# Local brain via Ollama. No API key, no rate limit, nothing leaves this Mac.
# Bigger = smarter but slower; 7b is the next step up if 3b gets sloppy at Tier 2.
backend = "auto"        # "ollama" (fast, free) | "claude-cli" (smart, paid) | "auto" (route per turn)
name = "qwen2.5:3b"
host = "http://localhost:11434"
timeout_seconds = 120
cli_model = "sonnet"    # only used when backend = "claude-cli"
keep_alive = "30m"      # how long Ollama holds the model in RAM between turns
# Hand that RAM back the moment Zetsu exits, instead of waiting out keep_alive.
# The model is ~2.2GB on an 8GB machine — warm while you are talking to it is
# the point, warm while you are not is a tax on everything else you have open.
release_on_exit = true

[router]
# Only used when backend = "auto". Fast and free by default; pay for the CLI
# when the ask actually wants a bigger model. Tune these freely.
force_prefix = "!"          # start a message with ! to always use Claude
escalate_over_chars = 280   # long, detailed asks are rarely simple
escalate_on = [
  "code", "script", "debug", "refactor", "function", "error", "stack trace",
  "browse", "web", "search online", "url", "download",
  "sort", "organise", "organize", "rename", "clean up", "file",
  "analyse", "analyze", "compare", "plan", "draft", "write a", "explain why",
]

[notes]
# Where search_notes looks. Read-only.
roots = ["~/Desktop", "~/Documents"]
extensions = [".md", ".txt", ".org"]
max_results = 20
timeout_seconds = 15

[tools]
# How many tool calls one turn may chain before Zetsu has to answer.
max_steps = 5

[voice]
# Ears: whisper.cpp, on-device. Nothing spoken here leaves this Mac.
whisper_model = "models/ggml-base.en.bin"
transcribe_timeout = 60

# Keep the Whisper model loaded in a local server instead of reloading 141MB on
# every chunk. Measured: 1.26s per chunk via the CLI, 0.15s via the server.
# Started automatically on first use; the CLI stays as a fallback.
# Voice activity detection. Measured on this mic: an empty room is about -48
# dBFS, speech about -33. The floor is learned from the room as you go, so a
# fan or a cafe does not break it; the margin is how far above the floor
# something has to be to count as you talking.
vad_silence_dbfs = -48
vad_margin_db = 8
vad_tail_ms = 350        # how much of a slice's end must be quiet to call it over
vad_skip_silent = true   # do not run whisper on a slice that is clearly silence

use_server = true
server_port = 8770
mic = ":0"           # ffmpeg avfoundation audio device — see `ffmpeg -f avfoundation -list_devices true -i ""`
max_seconds = 60     # hard cap on one recording

# Voice needs a predictable, streamable local model. The automatic router can
# choose the slower CLI for a word such as "explain", which makes spoken turns
# feel stalled and cannot be cancelled mid-call.
backend = "ollama"

# `say` is not native streaming TTS. Start a long first sentence at a word
# boundary rather than waiting indefinitely for its full stop.
speak_chunk_chars = 120
# The first fragment of a reply is released early, at a clause boundary, so
# sound starts before the sentence is finished. Later fragments wait for a full
# stop — by then there is no latency left to save and whole sentences sound better.
speak_opening_chars = 22

# Mouth. "piper" is a local neural voice — natural, still entirely offline, model
# held in memory. "say" is the macOS built-in: instant, always available, robotic.
# If the Piper model is missing it falls back to `say` on its own.
engine = "piper"
piper_model = "models/piper/en_US-amy-medium.onnx"

# Only used by the `say` engine. More voices: System Settings > Accessibility >
# Spoken Content > System Voice > Manage Voices.
# How long the mouth remembers what it said, so the ears can discard their own
# echo instead of treating it as you interrupting.
echo_memory_seconds = 20
# How much a heard slice has to resemble what was just said to count as the
# assistant's own echo. Lower catches more echo; too low and it ignores you.
echo_threshold = 0.45

say_voice = "Samantha"
say_rate = 190

[memory]
# Durable facts live in state/memory.md — plain text, edit it by hand any time.
load_limit = 40      # most recent facts loaded into the prompt each conversation

[heartbeat]
# Tier 5: acts without being spoken to. `enabled = false` is the kill switch —
# it's re-read every tick, so flipping it stops things without a restart.
enabled = true
interval_seconds = 900   # how often it checks for anything worth saying
quiet_start = "22:00"    # nothing is said in this window, only queued
quiet_end = "07:00"

[gate]
# Tools that send, spend, delete, write or run anything stop and ask first.
# That is decided in code, so a new consequential tool is gated by default.
# List a tool here to let it run unattended - this is the only way to loosen it.
unattended = []      # e.g. ["remember"] once memory prompts get tiresome

[audit]
# Plain log of what ran and why: state/audit.log. `/audit` shows the tail.
log_tokens = true    # per-turn token counts, so a runaway loop is visible

[dash]
# Local-only status page: http://localhost:8765
port = 8765
audit_lines = 40

[wake]
# Open-mic wake word. Push-to-talk (--voice) stays the reliable path; this sits
# on top of it. Everything is transcribed locally — nothing is uploaded, and
# nothing is kept: each chunk is deleted as soon as it has been read.
phrase = "Friday"
# What whisper actually hears when you say it. Add your own near-misses.
variants = ["friday", "fry day", "freeday", "free day", "fridays", "friday s"]
# How close a near-miss has to be to count (0-1). Lower wakes more easily but
# also on things you did not say. Raise it if it starts triggering on its own.
similarity = 0.78
takes = 3                # how many samples `--calibrate` records
# Asleep: long enough to hold the whole wake word in one slice. Latency does
# not matter here, reliability does — a chopped "Friday" is heard as "Day".
chunk_seconds = 2.5
# Awake: short slices so an interruption registers fast. Reliability matters
# less now, because you are mid-conversation and it collects across slices.
awake_chunk_seconds = 1.2
# Consecutive slices share this much audio, so a word spoken across the join is
# still complete in one of them. Costs a little CPU, buys reliable waking.
chunk_overlap_seconds = 0.7
show_chunks = true      # print every slice it hears — for debugging the mic
command_seconds = 6      # how long you get to speak after it wakes

# Full duplex is possible only when the microphone does not hear the assistant's
# own speaker output. Use headphones; laptop speakers will produce false
# interruptions without a real acoustic echo canceller.
barge_in = true
# Two words, not one. Whisper invents single words out of near-silence, and a
# stray one should never cancel a reply.
barge_in_min_words = 2

# Confirmations are answered out loud. Say yes or no. Anything else, or silence
# past the timeout, counts as NO — a gate that waits forever for someone who
# isn't there is a gate that quietly stops working.
# Words needed to interrupt *while it is still speaking*. Higher than the normal
# bar, because its own voice returns as short mangled fragments.
barge_in_while_speaking_words = 4
# How much louder than the room you must be to interrupt while it is talking.
# Its voice crosses the room; yours is a foot from the mic. Raise it if it still
# interrupts itself on speakers, lower it if it ignores you on headphones.
barge_in_duck_db = 18

confirm_timeout = 15
yes_words = ["yes", "yeah", "yep", "yup", "sure", "go ahead", "do it", "okay", "ok", "please do"]
no_words = ["no", "nope", "dont", "do not", "cancel", "stop", "never mind", "nevermind", "skip"]

# After it replies it keeps listening this long, so you can just answer a
# follow-up question instead of saying the wake word again. Silence past this
# and it goes back to sleep.
follow_up_seconds = 12

# Say any of these and it stays awake indefinitely — for a long conversation.
stay_awake = ["long conversation", "lets talk", "lets chat", "keep listening",
              "stay awake", "stay with me", "dont go to sleep", "keep the mic on"]

# Say any of these and it goes back to sleep until the wake word.
goodbyes = ["bye bye", "goodbye", "im done for the day", "im done for today",
            "stop listening", "thats all for now", "go to sleep", "that is all",
            "im finished", "we are done"]

[latency]
# A budget, not a wish. Every voice turn is measured against these and anything
# over is printed as OVER. The point is to know which stage to fix, not to make
# a vague plea for speed.
endpoint_ms = 400        # you stop talking -> it notices
stt_ms = 250             # audio -> text
first_token_ms = 350     # text -> model starts answering
first_audio_ms = 150     # first token -> sound leaves the speakers
total_ms = 800           # heard-to-heard

[stream]
# Continuous capture. There are no slices: one ffmpeg runs for the session and
# frames are measured as they arrive, so an utterance ends when you stop talking
# rather than when a fixed window happens to close.
frame_ms = 20            # granularity of the energy decision
preroll_ms = 300         # audio kept from before speech began, so onsets survive
# Silence before a turn is called over. 400ms was too eager: a normal thinking
# pause mid-sentence is 500-1000ms, and being cut off is far worse than waiting.
hangover_ms = 800
# If the sentence ends on a dangling word ("for my", "in the"), wait this much
# longer for the rest — so the latency is only paid when you are actually still
# talking, not on every turn.
continuation_ms = 1200
max_continuations = 3
min_speech_ms = 250      # anything shorter is a cough, not a sentence
max_utterance_ms = 20000 # hard stop, in case the silence never arrives
queue_frames = 500       # ~10s of buffer; oldest dropped rather than blocking

[reflex]
# Deterministic commands answered by code, not by the model. Not a speed
# optimisation — the model answers in 64ms — but a reliability one: a timer
# should never depend on a 3B parsing "ten" correctly.
enabled = true
max_timer_hours = 12

[deep]
# The big brain, at zero RAM cost. The Claude CLI runs as a subprocess against
# your existing login, so nothing extra is resident — which is why there is no
# second local model. Say one of these and the hard request goes to it.
phrases = ["think properly", "think hard", "think about this properly", "deep mode",
           "take your time", "really think", "think carefully"]
# It takes about two seconds, so say something first rather than going silent.
acknowledgement = "Let me think about that properly."
